name: Build and Publish to PyPI

on:
  workflow_dispatch:

jobs:
  ps2mc-core-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Sync workspace (optional but recommended)
        run: uv sync --all-packages

      - name: Build ps2mc-core
        working-directory: packages/ps2mc-core
        run: uv build

      - name: Publish ps2mc-core to PyPI
        working-directory: packages/ps2mc-core
        run: uv publish
